<!DOCTYPE html>
<html>
    <head>
        <title>SPELL CHECKER</title>
    </head>
    <body>
        <form method="post" enctype="application/x-www-form-urlencoded" action="/check_spelling">
            <p>Напишите слово для исправления</p>
            <input name="word" pattern="[А-Яа-я]+"/>
            <br/>
            <button type="submit">Анализировать</button>
        </form>
    </body>
</html>
